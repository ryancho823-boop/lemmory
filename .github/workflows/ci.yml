# Runs on every pull request and every push to main: typecheck, lint, the formula bank check, tests,
# production builds, the migration check, and every migration on an empty database.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the migration check can compare with the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The demo site reads a generated slice of the bank; build it before typechecking.
      - run: npx tsx scripts/build-demo-bank.ts
        working-directory: apps/site
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check
      - run: npm test
      # Production builds of all three sites, which catch errors typecheck and lint don't.
      - run: npm run build
      # Migrations already on the base branch may have run somewhere, so they must never change.
      - run: node packages/db/scripts/check-migrations.mjs ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      # Every migration, in order, on an empty database, then the sample data on top.
      - run: npm run db:migrate
      - run: npm run db:seed
