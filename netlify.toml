# Netlify detects Next.js and runs it with its Next.js runtime.
# `npm run build` first builds the demo's formula slice (the "prebuild" script).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Where the Sign up / Log in buttons point. Change these once the teacher and
  # student sites are deployed (they default to localhost for development).
  # NEXT_PUBLIC_TEACHER_URL = "https://teach.example.com"
  # NEXT_PUBLIC_STUDENT_URL = "https://app.example.com"
