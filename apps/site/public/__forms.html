<!doctype html>
<!-- Netlify Forms reads this file at deploy time to learn the form's fields.
     The real form is on /get-started (app/(site)/get-started/GetStartedForm.tsx),
     which posts here. Keep the fields in sync. -->
<html>
  <body>
    <form name="get-started" data-netlify="true" netlify-honeypot="company-website" hidden>
      <input type="hidden" name="form-name" value="get-started" />
      <input name="name" />
      <input name="email" type="email" />
      <select name="role">
        <option value="academy">Academy</option>
        <option value="club">School math club</option>
        <option value="student">Student</option>
        <option value="parent">Parent</option>
      </select>
      <input name="organization" />
      <input name="students" />
      <textarea name="message"></textarea>
      <input name="company-website" />
    </form>
  </body>
</html>
