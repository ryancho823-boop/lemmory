# The main site and demo. Netlify starts in this folder (see the netlify.toml at the
# repo root); `npm install` here installs the whole workspace from the repo root.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Later, when the app is online: set NEXT_PUBLIC_APP_URL in Netlify (Site configuration >
  # Environment variables) so Sign up / Log in go to it instead of /get-started.
