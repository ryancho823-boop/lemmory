# The main site and demo. In Netlify, choose "apps/site" under "Project to deploy".
# `npm install` in this folder installs the whole workspace from the repo root.
[build]
  # Netlify runs this from the repo root, and the publish path is relative to it too.
  command = "npm run build -w @lemmory/site"
  publish = "apps/site/.next"

[build.environment]
  NODE_VERSION = "22"
  # Later, when the app is online: set NEXT_PUBLIC_APP_URL in Netlify (Site configuration >
  # Environment variables) so Sign up / Log in go to it instead of /get-started.
