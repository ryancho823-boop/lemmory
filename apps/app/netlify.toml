# Netlify site 2: the student and teacher app (e.g. app.lemmory.com).
# In Netlify, set "Base directory" to the repo root (leave it blank) and
# "Package directory" to apps/app. This file is read from the package directory.
[build]
  command = "npm run build -w @lemmory/app"
  publish = "apps/app/.next"

[build.environment]
  NODE_VERSION = "22"
  # Set these two in Netlify (Site settings > Environment variables), never in this file:
  #   DATABASE_URL        libsql://<your-db>.turso.io
  #   DATABASE_AUTH_TOKEN <token from `turso db tokens create`>
